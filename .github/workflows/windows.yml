name: Windows
# The Windows port (docs/WINDOWS_PORT.md). Phase 1: the whole workspace must
# compile on Windows without warnings; every error is reported at once
# (--keep-going). Phase 2 (in progress, not yet required): the engine's unit
# tests run on Windows. Both logs are kept as artifacts. Nothing here is
# packaged or signed.
on:
  push:
    branches: [main]
    paths: ['native/**', 'src-tauri/**', 'ui/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows.yml']
  pull_request:
    paths: ['native/**', 'src-tauri/**', 'ui/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      # Job-wide so the check and the test build share one compilation.
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      # The desktop crate embeds the built interface (tauri.conf.json frontendDist).
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Compile everything for Windows (all errors at once)
        run: |
          set -o pipefail
          cargo +1.95.0 check --workspace --all-targets --locked --keep-going --message-format=short 2>&1 | tee windows-check.log
      - name: Summarize the errors
        if: always()
        run: |
          echo "errors: $(grep -c ': error' windows-check.log || true)"
          { grep ': error' windows-check.log || true; } | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort | uniq -c | sort -rn | head -80
      - name: Engine unit tests on Windows (phase 2, not yet required)
        id: unit
        continue-on-error: true
        env:
          # An error's backtrace says which call failed, not only its message.
          RUST_LIB_BACKTRACE: '1'
        run: |
          set -o pipefail
          cargo +1.95.0 test -p shadowcode-core --lib --locked --no-fail-fast 2>&1 | tee windows-test.log
      - name: Summarize the unit tests
        if: always() && steps.unit.outcome != 'skipped'
        run: |
          grep -E '^test result:' windows-test.log || true
          echo "failing tests:"
          { grep -E '^test .* \.\.\. FAILED$' windows-test.log || true; } | sed -E 's/^test //; s/ \.\.\. FAILED$//' | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-check-log
          path: |
            windows-check.log
            windows-test.log
          if-no-files-found: ignore
          retention-days: 14
