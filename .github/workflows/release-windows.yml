name: Windows release
# Build and qualify the windows artifacts for the coordinated release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.attach.outputs.artifact-id }}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach (for example v2.3.0)'
        required: true
  pull_request:
    paths:
      - '.github/workflows/release-windows.yml'
      - 'scripts/build-busybox-w32.sh'
      - 'scripts/build-llama.cpp.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/test-install-windows.ps1'
      - 'scripts/setup-windows-vulkan.ps1'
      - 'scripts/stage-windows-crt.ps1'
      - 'scripts/test-windows-installed-runtime.ps1'
      - 'packaging/windows/**'
      - 'src-tauri/tauri.windows.conf.json'
      - 'tools/busybox-w32.pin'
      - 'tools/busybox-w32-patches/**'
      - 'tools/llama.cpp.pin'
permissions:
  contents: read
concurrency:
  group: release-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || '' }}
jobs:
  busybox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false
      - name: Cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 bzip2
      - name: Build busybox-w32 and its complete source archive
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bash scripts/build-busybox-w32.sh --source-archive "source/ShadowCode_${version}_busybox-w32-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: busybox-w32
          path: packaging/busybox-w32/bin/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-source
          path: source/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  build:
    needs: busybox
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Require the tag to match the app version
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match app version $version" >&2; exit 1; }
      - run: npm --prefix ui ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: busybox-w32
          path: packaging/busybox-w32/bin
      - name: Install pinned Vulkan build tools
        shell: pwsh
        run: ./scripts/setup-windows-vulkan.ps1
      - name: Build and verify the GPU and CPU runtime modules
        run: |
          bash scripts/build-llama.cpp.sh --no-user-install
          test -s packaging/llama.cpp/bin/ggml-vulkan.dll
          grep -Fx 'backend=vulkan+cpu' packaging/llama.cpp/bin/COMMIT
      - name: Package third-party notices
        run: bash scripts/build-desktop-notices.sh
      - name: Stage app-local Microsoft CRT
        shell: powershell
        run: ./scripts/stage-windows-crt.ps1
      - name: Build the installer (NSIS, current user)
        env:
          SHADOWCODE_COMMIT: ${{ github.sha }}
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: CI=true ui/node_modules/.bin/tauri build --bundles nsis --config packaging/windows/bundle-runtime.conf.json
      - name: Check ambiguous local installer selection
        shell: pwsh
        run: ./scripts/test-install-windows.ps1
      - name: Install it silently and smoke-test the installed app
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          setup="target/release/bundle/nsis/ShadowCode_${version}_x64-setup.exe"
          test -f "$setup"
          # Through the published installer script (Windows PowerShell 5.1),
          # from this build's files instead of a download.
          setup_dir="$(mktemp -d)"
          cp "$setup" "$setup_dir/"
          (cd "$setup_dir" && sha256sum "ShadowCode_${version}_x64-setup.exe" > "ShadowCode_${version}_windows.sha256")
          SHADOWCODE_SETUP_DIR="$(cygpath -w "$setup_dir")" powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1
          powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | tr -d '\r' | tr ';' '\n' | grep -Fix "$(cygpath -w "$LOCALAPPDATA")\ShadowCode"
          app="$(cygpath -u "$LOCALAPPDATA")/ShadowCode"
          ls "$app"
          test -f "$app/shadowcode.exe"
          test -f "$app/busybox/busybox.exe"
          test -f "$app/busybox/LICENSE"
          test -f "$app/llama.cpp/llama-server.exe"
          "$app/llama.cpp/llama-server.exe" --version
          out="$(timeout 60 "$app/shadowcode.exe" --version 2>&1 || true)"
          echo "$out"
          grep -Fx "ShadowCode $version" <<<"$out"
          profile="$(mktemp -d)"
          timeout 120 "$app/shadowcode.exe" --profile "$(cygpath -w "$profile")" doctor --json > "$profile/doctor.json" || true
          node -e "const d=require(process.argv[1]); const c=(d.checks||[]).find(x=>x.id==='appcontainer'); if(!c||c.status!=='pass') throw new Error('Windows sandbox check: '+JSON.stringify(c))" "$(cygpath -w "$profile/doctor.json")"
      - name: Check installed binaries without toolchain DLLs on PATH
        shell: powershell
        run: ./scripts/test-windows-installed-runtime.ps1 -AppDirectory "$env:LOCALAPPDATA\ShadowCode"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  attach:
    outputs:
      artifact-id: ${{ steps.qualified.outputs.artifact-id }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-source
          path: windows
      - name: Require the workflow tag to match the build
        run: test "$GITHUB_REF" = "refs/tags/$TAG"
      - name: Attest the qualified installer bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: windows/*-setup.exe
      - name: Check required files and calculate their digests
        run: |
          version="${TAG#v}"
          cd windows
          ls
          setup="ShadowCode_${version}_x64-setup.exe"
          source="ShadowCode_${version}_busybox-w32-source.tar.gz"
          sums="ShadowCode_${version}_windows.sha256"
          test -f "$setup"
          test -f "$source"
          sha256sum "$setup" "$source" > "$sums"
          cat "$sums"
      - id: qualified
        name: Retain the qualified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-windows-${{ github.run_attempt }}
          path: windows/
          if-no-files-found: error
          compression-level: 0
